[project]
name = "ballet-boxing-bar"
version = "0.1.0"
description = "One-shot coordination games with explicit payoff and prompt conditions"
requires-python = ">=3.13"
dependencies = ["reps-events", "reps-experiment[llm]", "pydantic>=2"]
[project.scripts]
ballet-boxing-bar = "ballet_boxing_bar.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["ballet_boxing_bar"]
[dependency-groups]
dev = ["pytest>=8", "pytest-xdist", "reps-testing"]
[tool.uv.sources]
reps-events = { path = "../../lib/reps-events", editable = true }
reps-experiment = { path = "../../lib/reps-experiment" }
reps-testing = { path = "../../lib/reps-testing", editable = true }
